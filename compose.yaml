name: factory-template

services:
  postgres:
    image: postgres:18
    environment:
      # Superuser of the local container only; the application never uses it.
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
      # Development passwords for the roles created by infra/db/bootstrap.sql.
      APP_OWNER_PASSWORD: app_owner
      APP_RUNTIME_PASSWORD: app_runtime
      APP_ADMIN_PASSWORD: app_admin
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images store data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
      # Runs only when the volume is empty; see docs/runbooks/database.md.
      - ./infra/db/initdb.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
      - ./infra/db/bootstrap.sql:/bootstrap/bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Development email: the API sends invitations here over STARTTLS, as it would to a
  # real relay; read them at http://localhost:8025 (`mise run mail`). The certificate is
  # self-signed and new on every start, hence SMTP_TLS_SKIP_VERIFY in mise.toml, which
  # only development accepts.
  mailpit:
    image: axllent/mailpit:v1.34.0
    environment:
      MP_SMTP_TLS_CERT: sans:localhost
      MP_SMTP_TLS_KEY: sans:localhost
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
    # Only this machine: the inbox holds working invitation links.
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Local observability: an OTLP collector with Tempo (traces), Prometheus (metrics),
  # Loki and Grafana in one image. `mise run dev` exports to it (OTEL_* in mise.toml);
  # `mise run obs` opens Grafana. Only this machine can reach it.
  lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "127.0.0.1:3000:3000" # Grafana (admin / admin)
      - "127.0.0.1:4318:4318" # OTLP over HTTP
    volumes:
      - ./infra/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/custom:ro
      - ./infra/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro

volumes:
  pgdata:
