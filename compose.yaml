name: factory-template

services:
  postgres:
    image: postgres:18
    environment:
      # Superuser of the local container only; the application never uses it.
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
      # Development passwords for the roles created by infra/db/bootstrap.sql.
      APP_OWNER_PASSWORD: app_owner
      APP_RUNTIME_PASSWORD: app_runtime
      APP_ADMIN_PASSWORD: app_admin
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images store data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
      # Runs only when the volume is empty; see docs/runbooks/database.md.
      - ./infra/db/initdb.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
      - ./infra/db/bootstrap.sql:/bootstrap/bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
