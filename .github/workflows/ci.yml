# CI runs the same mise tasks as `mise run ci` locally, with the tool versions pinned in
# mise.toml. See docs/core/runbooks/ci.md.
#
# No `paths`/`paths-ignore` here: a workflow that does not run never reports `ci-ok`, the
# required check, and the PR stays blocked. Changes that only touch documentation still run
# it; the `changes` job tells the heavy jobs to skip and `ci-ok` accepts those skips.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; every push to main is checked to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_VERSION: 2026.11.10

jobs:
  # code=false only when every changed file is documentation; anything unknown is code.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # both ends of the range and their merge base
      - name: Classify the changed files
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/changes.sh "$EVENT" "$BASE" "$HEAD"

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go golangci-lint actionlint shellcheck
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: lint-${{ runner.os }}-${{ hashFiles('api/go.sum', 'api/.golangci.yml') }}
          restore-keys: lint-${{ runner.os }}-
      - run: mise run lint:go
      - run: mise run lint:actions
      - run: mise run arch

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('api/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      # Unit tests first: they need no Docker, so a failure there is reported quickly.
      - run: mise run test
      # Tests with the integration tag start Postgres (and Mailpit) with Testcontainers on
      # the runner's Docker.
      - run: mise run test:integration

  generate:
    name: generate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go node sqlc oapi-codegen
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.npm
          key: generate-${{ runner.os }}-${{ hashFiles('api/go.sum', 'web/package-lock.json') }}
          restore-keys: generate-${{ runner.os }}-
      - run: mise run generate:check

  security:
    name: security
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go go:golang.org/x/vuln/cmd/govulncheck trivy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('api/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - run: mise run security:govulncheck
      - run: mise run security:trivy

  # Always runs: a secret can be committed in a Markdown file too.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: gitleaks
      - run: mise run security:gitleaks

  # Always runs: docs/core/ and other core paths count as documentation for `changes`.
  # Passes in the template; in an app, fails if a core path (.template-paths) differs from
  # the template commit in .template-version. See docs/core/runbooks/template-sync.md.
  template:
    name: template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the commit of .template-version is somewhere in the history
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ env.MISE_VERSION }}
          install: false # the check only needs git
      - run: mise run template:check
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: node
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      # npm ci, Biome, the route tree, tsc (noEmit is set in tsconfig), the production
      # build and the unit tests. The Playwright journey runs in the e2e job.
      - run: mise run web:check
      - run: mise run web:test

  # The Playwright journey (web/e2e) against the real API: Postgres as a service, the
  # migrations, the API and Vite. Sessions are seeded with SQL and the MFA screens answer
  # with simulated responses, so WorkOS is never called: the API key is a placeholder that
  # start-up only checks is set. See docs/core/runbooks/ci.md.
  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
          APP_OWNER_PASSWORD: app_owner
          APP_RUNTIME_PASSWORD: app_runtime
          APP_ADMIN_PASSWORD: app_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factory -d factory"
          --health-interval 2s --health-timeout 3s --health-retries 30
      # The development SMTP of mise.toml: invitations go here as they do locally.
      mailpit:
        image: axllent/mailpit:v1.34.0
        env:
          MP_SMTP_TLS_CERT: sans:localhost
          MP_SMTP_TLS_KEY: sans:localhost
          MP_SMTP_REQUIRE_STARTTLS: "true"
          MP_SMTP_AUTH_ACCEPT_ANY: "true"
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go node
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.npm
          key: e2e-${{ runner.os }}-${{ hashFiles('api/go.sum', 'web/package-lock.json') }}
          restore-keys: e2e-${{ runner.os }}-
      # A service starts before the checkout, so it cannot mount infra/db like
      # compose.yaml does: the same bootstrap is copied in and run.
      - name: Bootstrap the database roles
        env:
          PG: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG" mkdir -p /bootstrap
          docker cp infra/db/bootstrap.sql "$PG:/bootstrap/bootstrap.sql"
          docker cp infra/db/initdb.sh "$PG:/bootstrap/initdb.sh"
          docker exec "$PG" bash /bootstrap/initdb.sh
      - run: mise run migrate
      - name: Start the API
        env:
          WORKOS_API_KEY: sk_test_ci_placeholder_never_sent
        run: |
          cd api
          go build -o "$RUNNER_TEMP/api" .
          mise exec -- "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          curl --silent --show-error --fail --retry 30 --retry-delay 1 --retry-all-errors \
            http://localhost:8080/readyz
      - name: Install the browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Playwright starts Vite (playwright.config.ts).
      - name: Playwright
        working-directory: web
        env:
          E2E_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: npm run e2e
      - name: Upload screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-and-traces
          path: |
            web/e2e-screenshots/
            web/test-results/
          if-no-files-found: warn
          retention-days: 14
      # The development invitation sender writes links to this log: tokens of this
      # throwaway database, uploaded only to debug a failure.
      - name: Upload the API log
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-api-log
          path: ${{ runner.temp }}/api.log
          retention-days: 7

  docker:
    name: docker
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: trivy
      # Builds the image without publishing it, then scans it.
      - run: mise run docker:scan

  # The only required status check on main: new jobs only need adding to `needs` (and, if
  # they are heavy, `needs: changes` with the same `if` as the others).
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, gitleaks, template, lint, test, generate, security, web, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `changes`, `gitleaks` and `template` must succeed. The rest must succeed, or be skipped because
      # `changes` said the change is documentation only.
      - name: Require every job to succeed or be skipped for documentation
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "code=$CODE"
          # Read up front: a jq failure must fail the step, not leave an empty loop that passes.
          results=$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          ok=0
          while read -r job result; do
            echo "$job: $result"
            case "$job:$result" in
              changes:success | gitleaks:success | template:success) ok=$((ok + 1)) ;;
              changes:* | gitleaks:* | template:*) bad=1 ;;
              *:success) ;;
              *:skipped) [ "$CODE" = "false" ] || bad=1 ;;
              *) bad=1 ;;
            esac
            if [ "${bad:-0}" -eq 1 ]; then
              echo "::error::Job '$job' finished with '$result' (code=$CODE)."
              exit 1
            fi
          done <<< "$results"
          if [ "$ok" -ne 3 ]; then
            echo "::error::The results of 'changes', 'gitleaks' or 'template' are missing."
            exit 1
          fi
