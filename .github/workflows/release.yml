# Publishes the API image once a push to main has passed CI (ci-ok green): built for
# linux/amd64 and linux/arm64, tagged with the commit and `main`, with provenance and an
# SBOM, and scanned once published. See docs/runbooks/release.md.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Nothing by default; the one job asks for what it needs.
permissions: {}

concurrency:
  # One publication at a time, in order: `main` must end on the latest commit.
  group: release
  cancel-in-progress: false

env:
  MISE_VERSION: 2026.11.10

jobs:
  image:
    name: image
    # CI also runs on pull requests; only a push to main that passed every job publishes.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store it in the repository
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # The commit CI checked, not whatever main points to now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Image name
        id: name
        # ghcr.io wants lower case; the owner's login may not be.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/factory-template-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.SHA }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ env.SHA }}
            ${{ steps.name.outputs.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          # BuildKit attestations, stored with the image: build provenance and an SBOM.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A GitHub attestation of the same digest: `gh attestation verify oci://… --owner …`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: trivy
      # The published image, by digest, on both platforms. Only vulnerabilities with a
      # fix fail it: those are the ones a rebuild or an upgrade can remove.
      - name: Scan the published image
        env:
          IMAGE: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "Scanning $IMAGE ($platform)"
            trivy image --quiet --platform "$platform" --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 "$IMAGE"
          done
