[tools]
go = "1.27.4"
node = "26.13.1"
sqlc = "1.31.1"
golangci-lint = "2.15.0"
sops = "3.13.3"
age = "1.3.2"
"aqua:pressly/goose" = "3.30.1"
oapi-codegen = "2.8.2"
# CI and security
"go:golang.org/x/vuln/cmd/govulncheck" = "1.10.0"
gitleaks = "8.30.1"
trivy = "0.76.2"
actionlint = "1.7.12"
shellcheck = "0.11.0" # used by actionlint to check run: scripts

# Defaults for local development against compose.yaml; .env (optional, gitignored) overrides them.
[env]
APP_ENV = "development"
HTTP_PORT = "8080"
LOG_LEVEL = "debug"
LOG_FORMAT = "json"
# The API connects as app_runtime (subject to RLS); only migrations use app_owner.
DATABASE_URL = "postgres://app_runtime:app_runtime@localhost:5432/factory?sslmode=disable"
MIGRATIONS_DATABASE_URL = "postgres://app_owner:app_owner@localhost:5432/factory?sslmode=disable"
# In development the front end (Vite, :5173) proxies /auth and /api to the API, so the
# browser sees one origin and the AuthKit callback lands on Vite (docs/core/runbooks/auth.md).
FRONTEND_ORIGIN = "http://localhost:5173"
ALLOWED_ORIGINS = "http://localhost:5173"
WORKOS_CLIENT_ID = "client_01M7V77YXSVNXZYGAW64XGHV92"
WORKOS_REDIRECT_URI = "http://localhost:5173/auth/callback"
# Invitations go to Mailpit (compose.yaml, `mise run mail`) by STARTTLS. Its certificate
# is self-signed, so verification is skipped: config accepts that only in development.
# Without SMTP_HOST (empty in .env) the links go to the API log instead.
SMTP_HOST = "localhost"
SMTP_PORT = "1025"
SMTP_FROM = "Factory Template <no-reply@localhost.test>"
SMTP_TLS = "starttls"
SMTP_TLS_SKIP_VERIFY = "true"
# Traces and metrics go to the local LGTM (compose.yaml, `mise run obs`); without it
# running, exports fail in the background and the API works the same. Metrics every
# 10 s instead of 60 s, to see them sooner. See docs/core/runbooks/observability.md.
OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4318"
OTEL_METRIC_EXPORT_INTERVAL = "10000"
# WORKOS_API_KEY lives in secrets.env (SOPS + age). mise cannot decrypt dotenv files
# (it would load the ciphertext), so `dev` runs under `sops exec-env` instead of _.file.
_.file = ".env"

[tasks."hooks:install"]
description = "Install the git pre-commit hook, which runs the pre-commit task (once per clone)"
run = "mise generate git-pre-commit --write --task pre-commit"

[tasks.pre-commit]
description = "Git pre-commit hook: refuse commits on main (work on a branch and open a PR)"
hide = true
run = """
branch=$(git symbolic-ref --short -q HEAD || true)
if [ "$branch" = "main" ]; then
  echo "pre-commit: refusing to commit on main. Create a branch first:" >&2
  echo "  git switch -c <type>/<topic>   # your staged changes come along" >&2
  exit 1
fi
"""

[tasks.up]
description = "Start local infrastructure (Postgres, Mailpit, LGTM) and wait until healthy"
run = "docker compose up -d --wait"

[tasks.down]
description = "Stop local infrastructure"
run = "docker compose down"

[tasks.mail]
description = "Open Mailpit, the development inbox (needs `up`)"
run = "command -v open >/dev/null && open http://localhost:8025 || xdg-open http://localhost:8025"

[tasks.obs]
description = "Open the local Grafana (LGTM) on the API dashboard (needs `up`)"
run = "command -v open >/dev/null && open http://localhost:3000/d/factory-template-api || xdg-open http://localhost:3000/d/factory-template-api"

[tasks.dev]
description = "Run the API with the secrets of secrets.env decrypted into its environment"
dir = "api"
run = "sops exec-env ../secrets.env 'go run .'"

[tasks."web:install"]
description = "Install web dependencies if missing"
dir = "web"
run = "test -d node_modules || npm ci"
hide = true

[tasks.generate]
description = "Generate code from SQL queries and the OpenAPI contract (core.yaml + app.yaml, merged)"
depends = ["web:install"]
run = [
  "cd api && sqlc generate",
  # core.yaml + app.yaml -> openapi.gen.yaml, the only contract the generators read.
  "cd api && go run ./tools/specmerge -core ../api-spec/core.yaml -app ../api-spec/app.yaml -out ../api-spec/openapi.gen.yaml",
  # One package per module that has a codegen.yaml, found by the glob (alphabetical,
  # core first): adding a module never edits this file. specmerge has checked that
  # each one generates exactly its folder's tag.
  """
  cd api
  # From scratch, so that a module whose codegen.yaml is gone leaves no package behind:
  # generate:check then sees its committed files as deleted.
  rm -rf gen/openapi
  for config in core/*/codegen.yaml app/modules/*/codegen.yaml; do
    [ -e "$config" ] || continue # the glob stays literal when app/modules has none yet
    oapi-codegen -config "$config" ../api-spec/openapi.gen.yaml || exit 1
  done
  """,
  "cd api && go run ./tools/routegen -spec ../api-spec/openapi.gen.yaml -out gen/routes/routes.gen.go",
  "cd web && npm run generate",
]

[tasks.migrate]
description = "Apply pending core and then app migrations as app_owner (the binary's `api migrate`)"
dir = "api"
run = "go run . migrate"

[tasks."migration:new"]
description = "Create an app migration in api/app/migrations: mise run migration:new <name>"
dir = "api"
usage = 'arg "<name>" help="Migration name, e.g. create_appointments"'
run = "goose -s -dir app/migrations create {{usage.name}} sql"

[tasks."migration:new:core"]
description = "Create a core migration in api/core/migrations (template only): mise run migration:new:core <name>"
dir = "api"
usage = 'arg "<name>" help="Migration name, e.g. add_sessions_index"'
run = "goose -s -dir core/migrations create {{usage.name}} sql"

[tasks."db:bootstrap"]
description = "Re-run the role and extension bootstrap on the local Postgres (idempotent)"
run = "docker compose exec -T postgres /docker-entrypoint-initdb.d/10-bootstrap.sh"

[tasks.test]
description = "Run the Go unit tests with the race detector (no Docker needed)"
dir = "api"
run = "go test -race -cover ./..."

[tasks."test:integration"]
description = "Run the Go tests that need Docker (Testcontainers), unit tests included: -tags integration"
dir = "api"
# Go cannot leave untagged files out, so the unit tests run again here; they take seconds.
run = "go test -race -cover -tags integration ./..."

[tasks.arch]
description = "Run architecture tests (module boundaries and lint-rule fixtures, api/tests/arch)"
dir = "api"
run = "go test -tags arch -count=1 ./tests/arch/..."

[tasks.lint]
description = "Lint Go, GitHub workflows and web code"
depends = ["web:install"]
run = [
  { task = "lint:go" },
  { task = "lint:actions" },
  "cd web && npm run lint && npm run typecheck",
]

[tasks."lint:go"]
description = "Lint Go code with golangci-lint"
dir = "api"
run = "golangci-lint run ./..."

[tasks."lint:actions"]
description = "Validate GitHub Actions workflows"
run = "actionlint"

[tasks.fmt]
description = "Format Go and web code"
depends = ["web:install"]
run = [
  "cd api && golangci-lint fmt ./...",
  "cd web && npm run format",
]

[tasks."generate:check"]
description = "Regenerate code and fail if it differs from what is checked in"
run = [
  { task = "generate" },
  """
  # openapi.gen.yaml included: an edit by hand is overwritten by the merge, so it shows here.
  dirty=$(git status --porcelain -- api/gen web/src/gen api-spec/openapi.gen.yaml)
  if [ -n "$dirty" ]; then
    echo "Generated code or api-spec/openapi.gen.yaml is out of date (never edit it by hand; change core.yaml or app.yaml)." >&2
    echo "Run 'mise run generate' and commit the result:" >&2
    echo "$dirty" >&2
    git --no-pager diff --stat -- api/gen web/src/gen api-spec/openapi.gen.yaml >&2
    exit 1
  fi
  echo "Generated code is up to date."
  """,
]

[tasks."security:govulncheck"]
description = "Report known vulnerabilities reachable from Go code"
dir = "api"
run = "govulncheck ./..."

[tasks."security:gitleaks"]
description = "Scan the full git history for committed secrets"
run = "gitleaks git --redact --no-banner ."

[tasks."security:trivy"]
description = "Scan dependencies and the Dockerfile; fail on HIGH or CRITICAL"
run = "trivy fs --quiet --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs web/node_modules ."

[tasks.security]
description = "Run every security scan"
run = [
  { task = "security:govulncheck" },
  { task = "security:gitleaks" },
  { task = "security:trivy" },
]

[tasks."web:check"]
description = "Check the web app: lint, route tree, types and production build"
dir = "web"
run = [
  "npm ci",
  "npm run lint",
  # The build generates src/gen/routeTree.gen.ts with the router CLI, then runs tsc -b and
  # vite build. The generated tree must match the commit.
  "npm run build",
  """
  if ! git diff --quiet -- src/gen/routeTree.gen.ts; then
    echo "src/gen/routeTree.gen.ts is out of date. Run 'npm run routes' in web/ and commit it." >&2
    exit 1
  fi
  """,
]

[tasks."web:test"]
description = "Run the web unit tests (Vitest)"
depends = ["web:install"]
dir = "web"
run = "npm test"

[tasks."web:e2e"]
description = "Run the browser journey (Playwright) against the local API; needs `up`, `migrate` and `dev` (CI: the e2e job)"
depends = ["web:install"]
dir = "web"
run = "npx playwright install chromium && npm run e2e"

[tasks."docker:build"]
description = "Build the API image locally (not published)"
run = "docker build --build-arg VERSION=$(git rev-parse HEAD) -t factory-template-api:ci api"

[tasks."docker:scan"]
description = "Scan the API image; fail on HIGH or CRITICAL"
depends = ["docker:build"]
run = "trivy image --quiet --severity HIGH,CRITICAL --exit-code 1 factory-template-api:ci"

[tasks.ci]
description = "Run locally what CI runs (needs Docker for integration tests)"
run = [
  { task = "lint:go" },
  { task = "lint:actions" },
  { task = "arch" },
  { task = "test" },
  { task = "test:integration" },
  { task = "generate:check" },
  { task = "security:govulncheck" },
  { task = "security:gitleaks" },
  { task = "web:check" },
  { task = "web:test" },
]
