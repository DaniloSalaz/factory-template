components:
  securitySchemes:
    session:
      description: The __Host-session cookie set by /auth/callback.
      type: apiKey
      in: cookie
      name: __Host-session
    tenant:
      description: >-
        The tenant the request acts in. The caller must be a member of it, the tenant active and, if the member's role requires it, the session's MFA recent enough; otherwise 403 auth.tenant_forbidden, auth.mfa_required (verify a factor: POST /me/mfa/challenges) or auth.mfa_enrollment_required (no verified factor yet: POST /me/mfa/totp).
      type: apiKey
      in: header
      name: X-Tenant-ID
  schemas:
    Me:
      type: object
      additionalProperties: false
      required: [user, memberships, mfa_enrolled, mfa_factors, session_mfa_at]
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        mfa_enrolled:
          description: The user has at least one verified factor.
          type: boolean
        mfa_factors:
          type: array
          items:
            $ref: "#/components/schemas/MFAFactor"
        session_mfa_at:
          description: When this session last verified a factor; null if never.
          type: [string, "null"]
          format: date-time
    MFAFactor:
      type: object
      additionalProperties: false
      required: [id, type, verified, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [totp]
        verified:
          description: False until its first code is verified.
          type: boolean
        created_at:
          type: string
          format: date-time
    TOTPEnrollment:
      type: object
      additionalProperties: false
      required: [factor_id, challenge_id, expires_at, qr_code, secret, uri]
      properties:
        factor_id:
          type: string
          format: uuid
        challenge_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        qr_code:
          description: A data URI of a PNG image to scan with an authenticator app. Shown once.
          type: string
        secret:
          description: The shared secret, for apps that cannot scan. Shown once.
          type: string
        uri:
          description: The otpauth:// URI the QR code encodes.
          type: string
    MFAChallengeRequest:
      type: object
      additionalProperties: false
      required: [factor_id]
      properties:
        factor_id:
          type: string
          format: uuid
    MFAChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, factor_id, expires_at]
      properties:
        challenge_id:
          type: string
          format: uuid
        factor_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    MFAVerifyRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
    MFAVerified:
      type: object
      additionalProperties: false
      required: [mfa_verified_at]
      properties:
        mfa_verified_at:
          type: string
          format: date-time
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, display_name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
    Membership:
      type: object
      additionalProperties: false
      required: [tenant_id, tenant_slug, tenant_name, tenant_status, role, mfa_required]
      properties:
        tenant_id:
          description: The value to send as X-Tenant-ID.
          type: string
          format: uuid
        tenant_slug:
          type: string
        tenant_name:
          type: string
        tenant_status:
          type: string
          enum: [active, suspended]
        role:
          description: The member's role in the app's role catalog.
          type: string
        mfa_required:
          description: The role requires a recent MFA to act in the tenant.
          type: boolean
    CurrentTenant:
      type: object
      additionalProperties: false
      required: [id, slug, name, role, scope, permissions]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        role:
          type: string
        scope:
          description: tenant sees every row of the tenant; own, only the caller's own.
          type: string
          enum: [tenant, own]
        permissions:
          description: The role's permissions in the app's catalog, sorted; none for an unknown role.
          type: array
          items:
            type: string
    Tenant:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    CreatedTenant:
      type: object
      additionalProperties: false
      required: [id, slug, name, role]
      properties:
        id:
          description: The value to send as X-Tenant-ID.
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        role:
          description: The caller's role in it, always owner.
          type: string
    TenantCreate:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          description: 1 to 100 characters, not only spaces; leading and trailing spaces are trimmed.
          type: string
        slug:
          description: >-
            3 to 40 lower-case letters, digits and hyphens, not starting or ending with a hyphen, unique and not reserved (api, www, admin…). It cannot change later.
          type: string
    TenantUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: 1 to 100 characters, not only spaces; leading and trailing spaces are trimmed.
          type: string
    Member:
      type: object
      additionalProperties: false
      required: [user_id, email, display_name, role, joined_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        role:
          type: string
        joined_at:
          type: string
          format: date-time
    MemberPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        next_cursor:
          description: Pass it as cursor to get the next page; null on the last one.
          type: [string, "null"]
    TenantRole:
      type: object
      additionalProperties: false
      required: [name, mfa_required, can_assign, can_offer]
      properties:
        name:
          type: string
        mfa_required:
          type: boolean
        can_assign:
          description: The caller may give this role to a member they manage.
          type: boolean
        can_offer:
          description: The caller may offer this role in an invitation.
          type: boolean
    TenantRoleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenantRole"
    MemberRoleChange:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          description: A role of the app's catalog.
          type: string
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, invited_by, expires_at, expired, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
        invited_by:
          description: The user who invited; null if that user has been deleted.
          type: [string, "null"]
          format: uuid
        expires_at:
          type: string
          format: date-time
        expired:
          description: It can no longer be accepted; resending renews it.
          type: boolean
        created_at:
          type: string
          format: date-time
    InvitationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        next_cursor:
          type: [string, "null"]
    InvitationCreate:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
        role:
          description: A role of the app's catalog that the caller may offer.
          type: string
    InvitationAccept:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          description: The token of the link's fragment (/invite#token=…).
          type: string
    AcceptedInvitation:
      type: object
      additionalProperties: false
      required: [tenant_id, role]
      properties:
        tenant_id:
          description: The value to send as X-Tenant-ID.
          type: string
          format: uuid
        role:
          type: string
    Logout:
      type: object
      additionalProperties: false
      required: [logout_url]
      properties:
        logout_url:
          description: Where to send the browser to end the AuthKit session too; null if there is none.
          type: [string, "null"]
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Liveness:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          description: >-
            The build: the git commit the image was built from, or "dev" for a local build without that information.
          type: string
    Problem:
      description: RFC 9457 problem details with this API's extension members.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          description: Stable, machine-readable error code, e.g. route_not_found.
          type: string
        errors:
          description: Per-field validation errors.
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        request_id:
          description: Request ID, also returned in the X-Request-ID header.
          type: string
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
  responses:
    Redirect:
      description: Redirect; cookies are set or cleared with Set-Cookie.
      headers:
        Location:
          schema:
            type: string
    LoggedOut:
      description: The session is revoked and its cookie cleared.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Logout"
    Unauthorized:
      description: No valid session.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The request is not allowed (for instance, a foreign Origin).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded; retry after the seconds of Retry-After.
      headers:
        Retry-After:
          description: Seconds until the quota allows another request.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The request body exceeds the size limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: The request is well-formed but invalid; see errors.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected server error. Details are logged, not returned.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A dependency is unavailable; retry later.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
