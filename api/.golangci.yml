version: "2"

run:
  tests: true
  # Architecture tests (tests/arch) and the tests that need Docker live behind these
  # tags; lint them too, or depguard and forbidigo would not see their files.
  build-tags: [arch, integration]

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gochecknoglobals
    - gochecknoinits
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
  settings:
    # Architecture rules. Messages name the rule and the fix so that whoever reads the
    # lint output (person or agent) can correct the code without looking anything up.
    # Each rule has a failing fixture in tests/arch/testdata/lint.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: >-
            [env-only-in-config] the environment is read only in platform/kit/config:
            add the variable to config.Config (env tag + Validate) and pass the value in
            through a constructor
    depguard:
      rules:
        # In strict mode depguard only prints the list name for imports missing from
        # `allow`, so these names carry the explanation.
        "[platform-no-modules] platform/kit must not import any platform module (platform/<x>): move the code into the module, or define an interface in kit that the module implements":
          files: ["**/platform/kit/**"]
          # In lax mode the longest match wins: kit may import kit and nothing else below
          # platform/ (identity, health, any future platform module). Importing app/ is
          # [platform-imports-app], checked for all of platform/ in tests/arch.
          list-mode: lax
          allow:
            - chaskicode.dev/saas/platform/kit
          deny:
            - pkg: chaskicode.dev/saas/platform
              desc: >-
                [platform-no-modules] platform/kit is shared infrastructure without business:
                move the code into the module, or define an interface in kit that the module
                implements
        "[apperr-stdlib-only] platform/kit/apperr may import only the standard library: keep it dependency-free so every domain package can use it":
          files: ["**/platform/kit/apperr/**"]
          list-mode: strict
          allow:
            - $gostd
            # Its own external test package (apperr_test) imports it.
            - chaskicode.dev/saas/platform/kit/apperr
        "[authctx-stdlib-only] platform/kit/authctx may import only the standard library: platform/kit/db and every module read it, so it must not pull dependencies into them":
          files: ["**/platform/kit/authctx/**"]
          list-mode: strict
          allow:
            - $gostd
            # Its own external test package (authctx_test) imports it.
            - chaskicode.dev/saas/platform/kit/authctx
        "[authz-in-use-cases] adapters/http must not import platform/kit/authz: check permissions in the use case (usecases/) with Require, never in the handler":
          files: ["**/platform/*/adapters/http/**", "**/app/modules/*/adapters/http/**"]
          deny:
            - pkg: chaskicode.dev/saas/platform/kit/authz
              desc: >-
                [authz-in-use-cases] permissions are checked in the use case (usecases/) with
                Authorizer.Require, so every transport gets the same check; the handler
                only calls the use case
        "[domain-pure] domain packages may import only the standard library and platform/kit/apperr: move infrastructure to adapters/ behind a port (interface) declared in usecases/":
          files: ["**/platform/*/domain/**", "**/app/modules/*/domain/**"]
          list-mode: strict
          allow:
            - $gostd
            - chaskicode.dev/saas/platform/kit/apperr
          deny:
            - pkg: net/http
              desc: >-
                [domain-pure] transport belongs in adapters/http; return apperr errors and
                let the adapter map them
            - pkg: database/sql
              desc: >-
                [domain-pure] persistence belongs in adapters/postgres behind a port
                declared in usecases/
    sloglint:
      kv-only: false
      attr-only: true
      context: scope
    wrapcheck:
      ignore-package-globs:
        - chaskicode.dev/saas/*
  exclusions:
    generated: strict
    paths:
      - gen/
    rules:
      - path: _test\.go
        linters: [gochecknoglobals, wrapcheck, gosec]
      # The one package allowed to read the environment, tests included.
      - path: platform/kit/config/
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - chaskicode.dev/saas
  exclusions:
    generated: strict
    paths:
      - gen/
