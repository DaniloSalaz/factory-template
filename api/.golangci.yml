version: "2"

run:
  tests: true
  # Architecture tests (tests/arch) and the tests that need Docker live behind these
  # tags; lint them too, or depguard and forbidigo would not see their files.
  build-tags: [arch, integration]

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gochecknoglobals
    - gochecknoinits
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
  settings:
    # Architecture rules. Messages name the rule and the fix so that whoever reads the
    # lint output (person or agent) can correct the code without looking anything up.
    # Each rule has a failing fixture in tests/arch/testdata/lint.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: >-
            [env-only-in-config] the environment is read only in core/kit/config:
            add the variable to config.Config (env tag + Validate) and pass the value in
            through a constructor
    depguard:
      rules:
        # In strict mode depguard only prints the list name for imports missing from
        # `allow`, so these names carry the explanation.
        "[platform-no-modules] core/kit must not import any platform module (core/<x>): move the code into the module, or define an interface in kit that the module implements":
          files: ["**/core/kit/**"]
          # In lax mode the longest match wins: kit may import kit and nothing else below
          # core/ (identity, health, any future platform module). Importing app/ is
          # [platform-imports-app], checked for all of core/ in tests/arch.
          list-mode: lax
          allow:
            - chaskicode.dev/saas/core/kit
          deny:
            - pkg: chaskicode.dev/saas/core
              desc: >-
                [platform-no-modules] core/kit is shared infrastructure without business:
                move the code into the module, or define an interface in kit that the module
                implements
        "[apperr-stdlib-only] core/kit/apperr may import only the standard library: keep it dependency-free so every domain package can use it":
          files: ["**/core/kit/apperr/**"]
          list-mode: strict
          allow:
            - $gostd
            # Its own external test package (apperr_test) imports it.
            - chaskicode.dev/saas/core/kit/apperr
        "[authctx-stdlib-only] core/kit/authctx may import only the standard library: core/kit/db and every module read it, so it must not pull dependencies into them":
          files: ["**/core/kit/authctx/**"]
          list-mode: strict
          allow:
            - $gostd
            # Its own external test package (authctx_test) imports it.
            - chaskicode.dev/saas/core/kit/authctx
        "[authz-in-use-cases] adapters/http must not import core/kit/authz: check permissions in the use case (usecases/) with Require, never in the handler":
          files: ["**/core/*/adapters/http/**", "**/app/modules/*/adapters/http/**"]
          deny:
            - pkg: chaskicode.dev/saas/core/kit/authz
              desc: >-
                [authz-in-use-cases] permissions are checked in the use case (usecases/) with
                Authorizer.Require, so every transport gets the same check; the handler
                only calls the use case
        "[domain-pure] domain packages may import only the standard library and core/kit/apperr: move infrastructure to adapters/ behind a port (interface) declared in usecases/":
          files: ["**/core/*/domain/**", "**/app/modules/*/domain/**"]
          list-mode: strict
          allow:
            - $gostd
            - chaskicode.dev/saas/core/kit/apperr
          deny:
            - pkg: net/http
              desc: >-
                [domain-pure] transport belongs in adapters/http; return apperr errors and
                let the adapter map them
            - pkg: database/sql
              desc: >-
                [domain-pure] persistence belongs in adapters/postgres behind a port
                declared in usecases/
    nolintlint:
      # A //nolint must name the linter it silences and say why, so the exception can be
      # reviewed without guessing what it hides.
      require-explanation: true
      require-specific: true
    sloglint:
      kv-only: false
      attr-only: true
      context: scope
    wrapcheck:
      ignore-package-globs:
        - chaskicode.dev/saas/*
  exclusions:
    generated: strict
    paths:
      - gen/
    rules:
      - path: _test\.go
        linters: [gochecknoglobals, wrapcheck, gosec]
      # The one package allowed to read the environment, tests included.
      - path: core/kit/config/
        linters: [forbidigo]
      # An adapter's exported methods implement a port whose contract is documented in
      # usecases/ (and checked with var _ Port = (*T)(nil)); requiring a comment on each
      # one, or one that starts with its name, only produces "X implements Port." filler.
      # package-comments still applies.
      - path: (^|/)(core/[^/]+|app/modules/[^/]+)/adapters/
        linters: [revive]
        text: "^exported: (exported .* should have comment|comment on exported .* should be of the form)"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - chaskicode.dev/saas
  exclusions:
    generated: strict
    paths:
      - gen/
