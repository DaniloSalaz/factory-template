version: "2"

run:
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gochecknoglobals
    - gochecknoinits
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
  settings:
    depguard:
      rules:
        domain-is-pure:
          files: ["**/internal/modules/*/domain/**"]
          # Strict: only the stdlib and the stdlib-only error vocabulary; deny still wins.
          list-mode: strict
          allow:
            - $gostd
            - github.com/DaniloSalaz/factory-template/api/internal/platform/apperr
          deny:
            - pkg: net/http
              desc: domain must not depend on transport
            - pkg: database/sql
              desc: domain must not depend on persistence
    sloglint:
      kv-only: false
      attr-only: true
      context: scope
    wrapcheck:
      ignore-package-globs:
        - github.com/DaniloSalaz/factory-template/api/*
  exclusions:
    generated: strict
    paths:
      - gen/
    rules:
      - path: _test\.go
        linters: [gochecknoglobals, wrapcheck, gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/DaniloSalaz/factory-template
  exclusions:
    generated: strict
    paths:
      - gen/
