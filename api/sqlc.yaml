version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: platform/health/queries
    gen:
      go:
        package: healthdb
        out: gen/sqlc/health
        sql_package: pgx/v5
        emit_interface: true
        # The schema holds every module's tables; generate only what this module's
        # queries use, so module code never depends on another module's models.
        omit_unused_structs: true
  - engine: postgresql
    schema: migrations
    queries: platform/identity/queries
    gen:
      go:
        package: identitydb
        out: gen/sqlc/identity
        sql_package: pgx/v5
        emit_interface: true
        omit_unused_structs: true
